plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

configurations.all {
    exclude group: 'androidx.lifecycle', module: 'lifecycle-common-java8'
}

android {
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
        unitTests.all {
            systemProperty 'robolectric.native.runtime', 'false'
            systemProperty 'robolectric.graphicsMode', 'LEGACY'
            systemProperty 'robolectric.sqliteMode', 'LEGACY'
        }
    }
    namespace 'com.duorhythm.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.duorhythm.app"
        minSdk 24
        targetSdk 34
        versionCode 68
        versionName "1.5.9-beta"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core-ktx:1.6.1"
    testImplementation "androidx.test.ext:junit:1.2.1"
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.github.Dimezis:BlurView:version-2.0.3'
    implementation 'androidx.work:work-runtime-ktx:2.8.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'androidx.room:room-runtime:2.5.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
